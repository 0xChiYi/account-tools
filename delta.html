<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲行动 · 战术配装与改枪库 - 0xChiYi Tools</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔫</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.65);
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-purple: #a855f7;
            --accent-red: #ef4444;
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container { width: 98vw; max-width: 2400px; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-muted); text-decoration: none; font-size: 16px; font-weight: 500;
        }
        .back-link:hover { color: #818cf8; }

        .header { text-align: center; margin-bottom: 28px; }
        .header h1 {
            font-size: 40px; font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: inline-flex; align-items: center; gap: 14px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 460px 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 1400px) {
            .layout-grid { grid-template-columns: 1fr; }
        }

        .panel-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 28px;
        }

        .smart-parse-box {
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.35);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .smart-input-row { display: flex; gap: 8px; }
        .smart-input-row input {
            flex: 1; padding: 10px 12px; font-size: 14px;
            background: rgba(15, 23, 42, 0.85); border-color: rgba(99, 102, 241, 0.4);
        }
        .btn-parse {
            background: #6366f1; border: none; color: white; padding: 0 16px;
            border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
            white-space: nowrap; transition: all 0.2s;
        }
        .btn-parse:hover { background: #4f46e5; }

        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        label { font-size: 14px; font-weight: 600; color: var(--text-muted); }

        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #818cf8; }

        .btn-submit {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            color: white; border: none; border-radius: var(--radius-md);
            font-weight: 600; cursor: pointer; font-size: 16px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .filter-bar {
            display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap;
        }

        .btn-filter {
            background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border);
            color: var(--text-muted); padding: 8px 18px; border-radius: 20px; font-size: 14px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-filter.active, .btn-filter:hover {
            background: #818cf8; color: white; border-color: #818cf8;
        }

        .weapon-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
            gap: 24px;
        }

        .weapon-hub-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .hub-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 12px;
        }
        .hub-title { font-size: 22px; font-weight: 700; color: white; display: flex; align-items: center; gap: 10px; }
        .hub-type-tag {
            font-size: 12px; background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4);
            color: #c7d2fe; padding: 4px 10px; border-radius: 8px; font-weight: 600;
        }

        /* 方案切换 Tab */
        .build-tabs-nav {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
        }
        .build-tab-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .build-tab-btn:hover { background: rgba(255,255,255,0.15); color: white; }
        
        .build-tab-btn.active-low { background: rgba(16, 185, 129, 0.2); border-color: rgba(16, 185, 129, 0.5); color: #10b981; }
        .build-tab-btn.active-mid { background: rgba(245, 158, 11, 0.2); border-color: rgba(245, 158, 11, 0.5); color: #f59e0b; }
        .build-tab-btn.active-high { background: rgba(168, 85, 247, 0.2); border-color: rgba(168, 85, 247, 0.5); color: #c084fc; }
        .build-tab-btn.active-spec { background: rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.5); color: #f87171; }

        /* 方案展示容器 */
        .build-display-content {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .build-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .build-title-text {
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 级别徽章样式 */
        .level-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .badge-low {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.25) 0%, rgba(5, 150, 105, 0.25) 100%);
            border: 1px solid #10b981;
            color: #34d399;
        }
        .badge-mid {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25) 0%, rgba(217, 119, 6, 0.25) 100%);
            border: 1px solid #f59e0b;
            color: #fbbf24;
        }
        .badge-high {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(126, 34, 206, 0.25) 100%);
            border: 1px solid #a855f7;
            color: #d8b4fe;
        }
        .badge-spec {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.25) 0%, rgba(185, 28, 28, 0.25) 100%);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .code-box {
            background: rgba(15, 23, 42, 0.9);
            border: 1px dashed rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .code-text {
            font-family: 'Fira Code', monospace;
            color: #38bdf8;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-copy {
            background: #0284c7;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
        }
        .btn-copy:hover { background: #38bdf8; color: black; }

        .meta-tags-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .meta-tag {
            font-size: 12px; background: rgba(255, 255, 255, 0.08); color: #cbd5e1;
            padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.06);
        }

        .build-desc {
            font-size: 13.5px; color: #cbd5e1; line-height: 1.6;
            background: rgba(15, 23, 42, 0.4); padding: 10px 12px; border-radius: 8px;
        }

        .action-bar {
            display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px;
        }
        .btn-sm {
            background: none; border: none; font-size: 13px; cursor: pointer; color: var(--text-muted);
        }
        .btn-sm:hover { color: white; }
        .btn-del:hover { color: var(--accent-red); }

        .backup-bar { margin-top: 32px; display: flex; justify-content: flex-end; gap: 14px; }
        .btn-backup {
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border);
            color: var(--text-muted); padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer;
        }
        .btn-backup:hover { background: rgba(255, 255, 255, 0.15); color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-link">← 🏠 返回工具箱导航</a>
            <span style="color: var(--text-muted); font-size: 14px;">🎯 三角洲行动 · 枪械多级配装方案库</span>
        </div>

        <div class="header">
            <h1>🔫 三角洲行动 · 枪械全级方案库</h1>
        </div>

        <div class="layout-grid">
            <!-- 左侧录入表单 -->
            <div class="panel-card">
                <h3 style="font-size: 18px; margin-bottom: 14px; color: white;" id="formTitle">✍️ 录入 / 追加改枪方案</h3>

                <!-- 智能一键解析器 -->
                <div class="smart-parse-box">
                    <label style="font-size:12px; color:#c7d2fe; display:flex; justify-content:space-between;">
                        <span>⚡ 游戏分享文本一键识别</span>
                        <span style="color:#94a3b8;">粘贴自动拆分</span>
                    </label>
                    <div class="smart-input-row">
                        <input type="text" id="smartInput" placeholder="例如: MK4冲锋枪-烽火地带-6KVE2280CDJAD6F4GCK57" oninput="autoSmartParse(this.value)">
                        <button type="button" class="btn-parse" onclick="autoSmartParse(document.getElementById('smartInput').value)">自动填单</button>
                    </div>
                </div>

                <form id="gunForm" onsubmit="saveGunBuild(event)">
                    <input type="hidden" id="editingWeaponName" value="">
                    <input type="hidden" id="editingBuildIndex" value="">
                    
                    <div class="input-group">
                        <label>枪械类型</label>
                        <select id="gunType" required>
                            <option value="突击步枪">突击步枪 (AR)</option>
                            <option value="冲锋枪">冲锋枪 (SMG)</option>
                            <option value="射手步枪">射手步枪 (DMR)</option>
                            <option value="狙击步枪">狙击步枪 (Sniper)</option>
                            <option value="轻机枪">轻机枪 (LMG)</option>
                            <option value="霰弹枪/手枪">霰弹枪 / 手枪</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>枪械型号 (已存在的枪会自动追加方案)</label>
                        <input type="text" id="gunName" placeholder="例如: MK4 / M4A1 / Vector / AS Val" required>
                    </div>

                    <div class="input-group">
                        <label>改装级别</label>
                        <select id="buildLevel" required>
                            <option value="低改">🟢 低改</option>
                            <option value="中改">🟡 中改</option>
                            <option value="高改">🟣 高改</option>
                            <option value="特化">🔴 特化</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>方案定位 / 场景名称</label>
                        <input type="text" id="buildTitle" placeholder="例如: 烽火地带 / 极限腰射 / 跑刀摸金">
                    </div>

                    <div class="input-group">
                        <label>改枪码 (字符串代码)</label>
                        <input type="text" id="gunCode" placeholder="粘贴游戏内的改枪代码..." style="font-family: monospace;" required>
                    </div>

                    <div class="input-group">
                        <label>风格特性标签 (逗号分隔)</label>
                        <input type="text" id="gunTags" placeholder="例如: 极致开镜, 微后座, 隐蔽消音, 75发大弹鼓">
                    </div>

                    <div class="input-group">
                        <label>配件搭配思路与压枪心得</label>
                        <textarea id="gunDesc" rows="3" placeholder="写下搭配逻辑（如：换装加长枪管增加有效射程，精校后坐力补偿...）"></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">⚡ 保存至枪械方案库</button>
                </form>
            </div>

            <!-- 右侧聚合卡片列表 -->
            <div class="panel-card">
                <div class="filter-bar">
                    <button class="btn-filter active" onclick="filterType('全部')">全部展示</button>
                    <button class="btn-filter" onclick="filterType('突击步枪')">突击步枪</button>
                    <button class="btn-filter" onclick="filterType('冲锋枪')">冲锋枪</button>
                    <button class="btn-filter" onclick="filterType('射手步枪')">射手步枪</button>
                    <button class="btn-filter" onclick="filterType('狙击步枪')">狙击步枪</button>
                    <button class="btn-filter" onclick="filterType('轻机枪')">轻机枪</button>
                </div>

                <div class="weapon-cards-grid" id="weaponCardsContainer"></div>
            </div>
        </div>

        <div class="backup-bar">
            <button class="btn-backup" onclick="exportData()">📤 导出配装备份 (JSON)</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 导入配装数据</button>
            <input type="file" id="importFile" style="display: none;" onchange="importData(event)" accept=".json">
        </div>
    </div>

    <script>
        let currentFilter = '全部';
        let activeBuildIndexMap = {};

        function normalizeLevel(level) {
            if (!level) return '中改';
            if (level.includes('低改')) return '低改';
            if (level.includes('中改')) return '中改';
            if (level.includes('高改')) return '高改';
            if (level.includes('特化')) return '特化';
            return level;
        }

        function getLevelBadgeInfo(level) {
            const norm = normalizeLevel(level);
            switch (norm) {
                case '低改':
                    return { icon: '🟢', text: '低改', badgeClass: 'badge-low', tabClass: 'active-low' };
                case '中改':
                    return { icon: '🟡', text: '中改', badgeClass: 'badge-mid', tabClass: 'active-mid' };
                case '高改':
                    return { icon: '🟣', text: '高改', badgeClass: 'badge-high', tabClass: 'active-high' };
                case '特化':
                default:
                    return { icon: '🔴', text: '特化', badgeClass: 'badge-spec', tabClass: 'active-spec' };
            }
        }

        function autoSmartParse(text) {
            text = text.trim();
            if (!text || !text.includes('-')) return;

            const parts = text.split('-');
            if (parts.length >= 3) {
                let rawGun = parts[0].trim();
                let rawMode = parts[1].trim();
                let rawCode = parts.slice(2).join('-').trim();

                let detectedType = "突击步枪";
                let cleanGunName = rawGun;

                if (rawGun.includes("冲锋枪")) {
                    detectedType = "冲锋枪";
                    cleanGunName = rawGun.replace(/冲锋枪/g, '').trim();
                } else if (rawGun.includes("突击步枪") || rawGun.includes("步枪")) {
                    detectedType = "突击步枪";
                    cleanGunName = rawGun.replace(/(突击)?步枪/g, '').trim();
                } else if (rawGun.includes("射手步枪") || rawGun.includes("连狙")) {
                    detectedType = "射手步枪";
                    cleanGunName = rawGun.replace(/(射手步枪|连狙)/g, '').trim();
                } else if (rawGun.includes("狙击") || rawGun.includes("栓动")) {
                    detectedType = "狙击步枪";
                    cleanGunName = rawGun.replace(/(狙击步枪|狙击枪|栓动)/g, '').trim();
                } else if (rawGun.includes("机枪")) {
                    detectedType = "轻机枪";
                    cleanGunName = rawGun.replace(/(轻)?机枪/g, '').trim();
                } else if (rawGun.includes("手枪") || rawGun.includes("霰弹")) {
                    detectedType = "霰弹枪/手枪";
                }

                let levelVal = "中改";
                if (rawMode.includes("烽火") || rawMode.includes("中改")) {
                    levelVal = "中改";
                } else if (rawMode.includes("全面") || rawMode.includes("高改") || rawMode.includes("顶配")) {
                    levelVal = "高改";
                } else if (rawMode.includes("跑刀") || rawMode.includes("低改") || rawMode.includes("摸金")) {
                    levelVal = "低改";
                } else if (rawMode.includes("腰射") || rawMode.includes("特化")) {
                    levelVal = "特化";
                }

                document.getElementById('gunType').value = detectedType;
                document.getElementById('gunName').value = cleanGunName || rawGun;
                document.getElementById('buildLevel').value = levelVal;
                document.getElementById('buildTitle').value = rawMode;
                document.getElementById('gunCode').value = rawCode;
                document.getElementById('gunTags').value = `${rawMode}, ${cleanGunName}`;
                document.getElementById('gunDesc').value = `来自游戏分享：【${rawGun}】适用【${rawMode}】`;
            }
        }

        function getStorageData() {
            const data = localStorage.getItem('delta_weapons_hub');
            return data ? JSON.parse(data) : [
                {
                    name: "MK4",
                    type: "冲锋枪",
                    builds: [
                        {
                            level: "中改",
                            title: "烽火地带",
                            code: "6KVE2280CDJAD6F4GCK57",
                            tags: ["烽火地带", "MK4", "均衡控枪"],
                            desc: "来自游戏分享：【MK4冲锋枪】适用【烽火地带】"
                        },
                        {
                            level: "低改",
                            title: "跑刀摸金",
                            code: "MK4-LOW-BUDGET-6688",
                            tags: ["低造价", "近距离腰射"],
                            desc: "极限压低改装成本，适合跑刀打人机。"
                        }
                    ]
                },
                {
                    name: "M4A1",
                    type: "突击步枪",
                    builds: [
                        {
                            level: "高改",
                            title: "全面战场激光枪",
                            code: "M4A1-DELTA-LASER-999",
                            tags: ["零后坐", "百米架枪", "60发大弹匣"],
                            desc: "顶配精校枪口与枪托，后坐力极小，适合中远距离持续架枪压制。"
                        }
                    ]
                }
            ];
        }

        function setStorageData(data) {
            localStorage.setItem('delta_weapons_hub', JSON.stringify(data));
        }

        function renderWeapons() {
            const weapons = getStorageData();
            const container = document.getElementById('weaponCardsContainer');
            container.innerHTML = '';

            const filtered = currentFilter === '全部' ? weapons : weapons.filter(w => w.type === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px 0;">暂无该类型枪械方案，在左侧一键解析录入吧！</p>`;
                return;
            }

            filtered.forEach(weapon => {
                if (activeBuildIndexMap[weapon.name] === undefined || activeBuildIndexMap[weapon.name] >= weapon.builds.length) {
                    activeBuildIndexMap[weapon.name] = 0;
                }
                const activeIndex = activeBuildIndexMap[weapon.name];
                const curBuild = weapon.builds[activeIndex] || weapon.builds[0];
                const activeLevelInfo = getLevelBadgeInfo(curBuild.level);

                let tabsHtml = '';
                weapon.builds.forEach((b, idx) => {
                    const isActive = idx === activeIndex;
                    const bLevelInfo = getLevelBadgeInfo(b.level);
                    const activeClass = isActive ? bLevelInfo.tabClass : '';
                    tabsHtml += `
                        <button class="build-tab-btn ${activeClass}" onclick="switchBuild('${weapon.name}', ${idx})">
                            <span>${bLevelInfo.icon}</span>
                            <span>${b.title || bLevelInfo.text}</span>
                        </button>
                    `;
                });

                let tagsHtml = (curBuild.tags || []).map(t => `<span class="meta-tag">🏷️ ${t.trim()}</span>`).join('');

                container.innerHTML += `
                    <div class="weapon-hub-card">
                        <div class="hub-header">
                            <div class="hub-title">
                                <span>${weapon.name}</span>
                                <span style="font-size:13px; color:var(--text-muted); font-weight:normal;">(${weapon.builds.length} 套方案)</span>
                            </div>
                            <span class="hub-type-tag">${weapon.type}</span>
                        </div>

                        <div class="build-tabs-nav">${tabsHtml}</div>

                        <div class="build-display-content">
                            <div class="build-header-row">
                                <div class="build-title-text">
                                    <span>${curBuild.title || activeLevelInfo.text}</span>
                                </div>
                                <span class="level-badge ${activeLevelInfo.badgeClass}">
                                    ${activeLevelInfo.icon} ${activeLevelInfo.text}
                                </span>
                            </div>

                            <div class="code-box">
                                <span class="code-text" title="${curBuild.code}">${curBuild.code}</span>
                                <button class="btn-copy" onclick="copyCode('${curBuild.code}', this)">📋 复制改枪码</button>
                            </div>

                            <div class="meta-tags-row">${tagsHtml}</div>
                            <div class="build-desc">💡 ${curBuild.desc || '暂无详细搭配说明'}</div>
                        </div>

                        <div class="action-bar">
                            <button class="btn-sm" onclick="editBuild('${weapon.name}', ${activeIndex})">✏️ 编辑此方案</button>
                            <button class="btn-sm btn-del" onclick="deleteBuild('${weapon.name}', ${activeIndex})">🗑️ 删除此方案</button>
                        </div>
                    </div>
                `;
            });
        }

        function switchBuild(weaponName, index) {
            activeBuildIndexMap[weaponName] = index;
            renderWeapons();
        }

        function filterType(type) {
            currentFilter = type;
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(type));
            });
            renderWeapons();
        }

        function saveGunBuild(e) {
            e.preventDefault();
            let weapons = getStorageData();

            const editingWeaponName = document.getElementById('editingWeaponName').value;
            const editingBuildIndex = document.getElementById('editingBuildIndex').value;

            const gunType = document.getElementById('gunType').value;
            const gunName = document.getElementById('gunName').value.trim();
            const level = normalizeLevel(document.getElementById('buildLevel').value);
            const title = document.getElementById('buildTitle').value.trim();
            const code = document.getElementById('gunCode').value.trim();
            const tagsRaw = document.getElementById('gunTags').value.trim();
            const tags = tagsRaw ? tagsRaw.split(/[,，]/).filter(Boolean) : [];
            const desc = document.getElementById('gunDesc').value.trim();

            const newBuild = { level, title, code, tags, desc };

            if (editingWeaponName !== "") {
                const wIdx = weapons.findIndex(w => w.name === editingWeaponName);
                if (wIdx !== -1) {
                    weapons[wIdx].builds[parseInt(editingBuildIndex)] = newBuild;
                    weapons[wIdx].type = gunType;
                }
                resetForm();
            } else {
                const existIndex = weapons.findIndex(w => w.name.toUpperCase() === gunName.toUpperCase());
                if (existIndex !== -1) {
                    weapons[existIndex].builds.push(newBuild);
                    activeBuildIndexMap[weapons[existIndex].name] = weapons[existIndex].builds.length - 1;
                } else {
                    weapons.unshift({
                        name: gunName,
                        type: gunType,
                        builds: [newBuild]
                    });
                    activeBuildIndexMap[gunName] = 0;
                }
                document.getElementById('gunForm').reset();
                document.getElementById('smartInput').value = '';
            }

            setStorageData(weapons);
            renderWeapons();
        }

        function editBuild(weaponName, index) {
            const weapons = getStorageData();
            const weapon = weapons.find(w => w.name === weaponName);
            if (!weapon || !weapon.builds[index]) return;

            const b = weapon.builds[index];
            document.getElementById('editingWeaponName').value = weaponName;
            document.getElementById('editingBuildIndex').value = index;

            document.getElementById('gunType').value = weapon.type;
            document.getElementById('gunName').value = weapon.name;
            document.getElementById('buildLevel').value = normalizeLevel(b.level);
            document.getElementById('buildTitle').value = b.title || '';
            document.getElementById('gunCode').value = b.code;
            document.getElementById('gunTags').value = (b.tags || []).join(', ');
            document.getElementById('gunDesc').value = b.desc || '';

            document.getElementById('formTitle').innerText = `✏️ 编辑 [${weapon.name}] 的方案`;
            document.getElementById('submitBtn').innerText = '✨ 保存修改后的方案';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteBuild(weaponName, index) {
            if (confirm(`确定要删除 [${weaponName}] 的这套方案吗？`)) {
                let weapons = getStorageData();
                const wIdx = weapons.findIndex(w => w.name === weaponName);
                if (wIdx !== -1) {
                    weapons[wIdx].builds.splice(index, 1);
                    if (weapons[wIdx].builds.length === 0) {
                        weapons.splice(wIdx, 1);
                    }
                    setStorageData(weapons);
                    activeBuildIndexMap[weaponName] = 0;
                    renderWeapons();
                }
            }
        }

        function resetForm() {
            document.getElementById('editingWeaponName').value = '';
            document.getElementById('editingBuildIndex').value = '';
            document.getElementById('formTitle').innerText = '✍️ 录入 / 追加改枪方案';
            document.getElementById('submitBtn').innerText = '⚡ 保存至枪械方案库';
            document.getElementById('gunForm').reset();
            document.getElementById('smartInput').value = '';
        }

        function copyCode(code, btn) {
            navigator.clipboard.writeText(code).then(() => {
                const oldText = btn.innerText;
                btn.innerText = "✅ 已复制!";
                setTimeout(() => btn.innerText = oldText, 1500);
            });
        }

        function exportData() {
            const data = getStorageData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `delta_weapons_hub_backup.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        setStorageData(imported);
                        alert("✅ 配装数据导入成功！");
                        renderWeapons();
                    }
                } catch (err) {
                    alert("❌ 文件格式错误！");
                }
            };
            reader.readAsText(file);
        }

        renderWeapons();
    </script>
</body>
</html>
