<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三角洲行动 · 改枪码与配装库 - 0xChiYi Tools</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔫</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.65);
            --accent-green: #10b981;
            --accent-gold: #f59e0b;
            --accent-red: #ef4444;
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container { width: 98vw; max-width: 2200px; }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-muted); text-decoration: none; font-size: 16px; font-weight: 500;
        }
        .back-link:hover { color: #818cf8; }

        .header { text-align: center; margin-bottom: 28px; }
        .header h1 {
            font-size: 38px; font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            display: inline-flex; align-items: center; gap: 12px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 460px 1fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 1200px) {
            .layout-grid { grid-template-columns: 1fr; }
        }

        .panel-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 28px;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
        label { font-size: 14px; font-weight: 600; color: var(--text-muted); }

        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #818cf8; }

        .btn-submit {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            color: white; border: none; border-radius: var(--radius-md);
            font-weight: 600; cursor: pointer; font-size: 16px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .filter-bar {
            display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap;
        }

        .btn-filter {
            background: rgba(15, 23, 42, 0.6); border: 1px solid var(--card-border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 20px; font-size: 14px;
            cursor: pointer; transition: all 0.2s;
        }
        .btn-filter.active, .btn-filter:hover {
            background: #818cf8; color: white; border-color: #818cf8;
        }

        .code-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
        }

        .weapon-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .weapon-header {
            display: flex; justify-content: space-between; align-items: center;
        }
        .weapon-name { font-size: 20px; font-weight: 700; color: white; }
        .weapon-type-tag {
            font-size: 12px; background: rgba(99, 102, 241, 0.2); border: 1px solid rgba(99, 102, 241, 0.4);
            color: #c7d2fe; padding: 4px 10px; border-radius: 8px; font-weight: 600;
        }

        .code-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .code-text {
            font-family: 'Fira Code', monospace;
            color: #38bdf8;
            font-size: 14px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-copy {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .btn-copy:hover { background: #38bdf8; color: black; }

        .tag-row { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag-pill {
            font-size: 11px; background: rgba(245, 158, 11, 0.15); color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3); padding: 2px 8px; border-radius: 6px;
        }

        .desc-box {
            font-size: 13px; color: var(--text-muted); line-height: 1.5;
            background: rgba(15, 23, 42, 0.4); padding: 10px; border-radius: 8px;
        }

        .action-bar {
            display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 10px;
        }
        .btn-sm {
            background: none; border: none; font-size: 13px; cursor: pointer; color: var(--text-muted);
        }
        .btn-sm:hover { color: white; }
        .btn-del:hover { color: var(--accent-red); }

        .backup-bar { margin-top: 24px; display: flex; justify-content: flex-end; gap: 14px; }
        .btn-backup {
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border);
            color: var(--text-muted); padding: 10px 18px; border-radius: 10px; font-size: 14px; cursor: pointer;
        }
        .btn-backup:hover { background: rgba(255, 255, 255, 0.15); color: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back-link">← 🏠 返回工具箱导航</a>
            <span style="color: var(--text-muted); font-size: 14px;">🎯 三角洲行动 · 战术配装管理库</span>
        </div>

        <div class="header">
            <h1>🔫 三角洲行动 · 改枪码 & 方案库</h1>
        </div>

        <div class="layout-grid">
            <!-- 左侧：录入与修改表单 -->
            <div class="panel-card">
                <h3 style="font-size: 18px; margin-bottom: 18px; color: white;" id="formTitle">✍️ 录入新改枪方案</h3>
                <form id="gunForm" onsubmit="saveGun(event)">
                    <input type="hidden" id="editingId" value="">
                    
                    <div class="input-group">
                        <label>枪械类型</label>
                        <select id="gunType" required>
                            <option value="突击步枪">突击步枪 (AR)</option>
                            <option value="冲锋枪">冲锋枪 (SMG)</option>
                            <option value="射手步枪">射手步枪 (DMR)</option>
                            <option value="狙击步枪">狙击步枪 (Sniper)</option>
                            <option value="轻机枪">轻机枪 (LMG)</option>
                            <option value="霰弹枪/手枪">霰弹枪 / 手枪</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>枪械名称 (型号)</label>
                        <input type="text" id="gunName" placeholder="例如: M4A1 / RCX-Spear / AS Val" required>
                    </div>

                    <div class="input-group">
                        <label>改枪码 (字符串代码)</label>
                        <input type="text" id="gunCode" placeholder="粘贴游戏内的改枪代码..." style="font-family: monospace;" required>
                    </div>

                    <div class="input-group">
                        <label>适用场景 / 风格标签</label>
                        <input type="text" id="gunTags" placeholder="例如: 全面战场, 极致压枪, 烽火跑刀 (逗号分隔)">
                    </div>

                    <div class="input-group">
                        <label>改枪思路 / 核心配件说明</label>
                        <textarea id="gunDesc" rows="4" placeholder="写下搭配逻辑（如：加装重型消音、长枪管提升初速，专打中远距离...）"></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="submitBtn">⚡ 保存改枪方案</button>
                </form>
            </div>

            <!-- 右侧：方案展示与筛选列表 -->
            <div class="panel-card">
                <div class="filter-bar">
                    <button class="btn-filter active" onclick="filterType('全部')">全部展示</button>
                    <button class="btn-filter" onclick="filterType('突击步枪')">突击步枪</button>
                    <button class="btn-filter" onclick="filterType('冲锋枪')">冲锋枪</button>
                    <button class="btn-filter" onclick="filterType('射手步枪')">射手步枪</button>
                    <button class="btn-filter" onclick="filterType('狙击步枪')">狙击步枪</button>
                    <button class="btn-filter" onclick="filterType('轻机枪')">轻机枪</button>
                </div>

                <div class="code-grid" id="gunList"></div>
            </div>
        </div>

        <div class="backup-bar">
            <button class="btn-backup" onclick="exportData()">📤 导出配装备份 (JSON)</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 导入配装数据</button>
            <input type="file" id="importFile" style="display: none;" onchange="importData(event)" accept=".json">
        </div>
    </div>

    <script>
        let currentFilter = '全部';

        function getStorageData() {
            const data = localStorage.getItem('delta_gun_codes');
            return data ? JSON.parse(data) : [
                {
                    id: 1,
                    type: "突击步枪",
                    name: "M4A1 突击步枪",
                    code: "M4A1-667788-PRO-DELTA",
                    tags: ["全面战场", "长距离微后座"],
                    desc: "装备长枪管与重型消音器，大幅提高子弹初速与衰减距离，后坐力极其平稳，适合 50 米外架枪压制。"
                },
                {
                    id: 2,
                    type: "冲锋枪",
                    name: "Vector 冲锋枪",
                    code: "VEC-HIPFIRE-9900-MAX",
                    tags: ["烽火地带", "腰射瞬秒", "近距离突脸"],
                    desc: "极限堆开镜移速与腰射散布，近距离贴脸 0.2 秒瞬间蒸发敌人，适合摸金室内战。"
                }
            ];
        }

        function setStorageData(data) {
            localStorage.setItem('delta_gun_codes', JSON.stringify(data));
        }

        function renderList() {
            const list = getStorageData();
            const container = document.getElementById('gunList');
            container.innerHTML = '';

            const filtered = currentFilter === '全部' ? list : list.filter(item => item.type === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px 0;">暂无该类型配装方案，快去左侧录入吧！</p>`;
                return;
            }

            filtered.forEach(item => {
                let tagsHtml = (item.tags || []).map(t => `<span class="tag-pill">🏷️ ${t.trim()}</span>`).join('');

                container.innerHTML += `
                    <div class="weapon-card">
                        <div class="weapon-header">
                            <span class="weapon-name">${item.name}</span>
                            <span class="weapon-type-tag">${item.type}</span>
                        </div>

                        <div class="code-box">
                            <span class="code-text" title="${item.code}">${item.code}</span>
                            <button class="btn-copy" onclick="copyCode('${item.code}', this)">📋 复制改枪码</button>
                        </div>

                        <div class="tag-row">${tagsHtml}</div>

                        <div class="desc-box">💡 ${item.desc || '暂无详细配件说明'}</div>

                        <div class="action-bar">
                            <button class="btn-sm" onclick="editGun(${item.id})">✏️ 编辑</button>
                            <button class="btn-sm btn-del" onclick="deleteGun(${item.id})">🗑️ 删除</button>
                        </div>
                    </div>
                `;
            });
        }

        function filterType(type) {
            currentFilter = type;
            document.querySelectorAll('.btn-filter').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.includes(type));
            });
            renderList();
        }

        function saveGun(e) {
            e.preventDefault();
            let list = getStorageData();
            const editingId = document.getElementById('editingId').value;

            const tagsRaw = document.getElementById('gunTags').value.trim();
            const tags = tagsRaw ? tagsRaw.split(/[,，]/).filter(Boolean) : [];

            const gunData = {
                id: editingId ? parseInt(editingId) : Date.now(),
                type: document.getElementById('gunType').value,
                name: document.getElementById('gunName').value.trim(),
                code: document.getElementById('gunCode').value.trim(),
                tags: tags,
                desc: document.getElementById('gunDesc').value.trim()
            };

            if (editingId) {
                list = list.map(g => g.id === parseInt(editingId) ? gunData : g);
                document.getElementById('editingId').value = '';
                document.getElementById('formTitle').innerText = '✍️ 录入新改枪方案';
                document.getElementById('submitBtn').innerText = '⚡ 保存改枪方案';
            } else {
                list.unshift(gunData);
            }

            setStorageData(list);
            document.getElementById('gunForm').reset();
            renderList();
        }

        function editGun(id) {
            const list = getStorageData();
            const item = list.find(g => g.id === id);
            if (!item) return;

            document.getElementById('editingId').value = item.id;
            document.getElementById('gunType').value = item.type;
            document.getElementById('gunName').value = item.name;
            document.getElementById('gunCode').value = item.code;
            document.getElementById('gunTags').value = (item.tags || []).join(', ');
            document.getElementById('gunDesc').value = item.desc || '';

            document.getElementById('formTitle').innerText = '✏️ 编辑改枪方案';
            document.getElementById('submitBtn').innerText = '✨ 保存修改';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteGun(id) {
            if (confirm("确定删除这套改枪方案吗？")) {
                let list = getStorageData();
                list = list.filter(g => g.id !== id);
                setStorageData(list);
                renderList();
            }
        }

        function copyCode(code, btn) {
            navigator.clipboard.writeText(code).then(() => {
                const oldText = btn.innerText;
                btn.innerText = "✅ 已复制!";
                setTimeout(() => btn.innerText = oldText, 1500);
            });
        }

        function exportData() {
            const data = getStorageData();
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `delta_gun_codes_backup.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        setStorageData(imported);
                        alert("✅ 配装数据导入成功！");
                        renderList();
                    }
                } catch (err) {
                    alert("❌ 文件格式错误！");
                }
            };
            reader.readAsText(file);
        }

        renderList();
    </script>
</body>
</html>
