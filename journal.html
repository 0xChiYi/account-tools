<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEME 交易纪律 & 复盘日历 - 0xChiYi Tools</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 1200px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-muted); text-decoration: none; font-size: 13px; margin-bottom: 16px;
        }
        .back-link:hover { color: #818cf8; }

        .header { text-align: center; margin-bottom: 20px; }
        .header h1 {
            font-size: 26px; font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* 顶部看板 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 16px;
            text-align: center;
        }

        .stat-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .stat-value { font-size: 22px; font-weight: 700; font-family: 'Fira Code', monospace; }
        .val-green { color: var(--accent-green); }
        .val-red { color: var(--accent-red); }

        /* 核心：左右双栏布局 */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .dashboard-layout { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }

        /* 录入表单样式放大 */
        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group.full { grid-column: 1 / -1; }
        label { font-size: 12px; font-weight: 600; color: var(--text-muted); }

        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            color: white;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #818cf8; }

        .btn-submit {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            color: white; border: none; border-radius: var(--radius-md);
            font-weight: 600; cursor: pointer; font-size: 14px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        /* 紧凑型日历样式 */
        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 20px;
        }

        .calendar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px;
        }

        .cal-btn {
            background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
            color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
        }
        .cal-btn:hover { background: rgba(255,255,255,0.15); }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center;
        }

        .cal-day-label { font-size: 11px; color: var(--text-muted); font-weight: 600; padding-bottom: 4px; }

        .cal-day {
            height: 52px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            padding: 4px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.2s; font-size: 11px;
        }

        .cal-day:hover { border-color: #818cf8; transform: translateY(-1px); }
        .cal-day.empty { background: transparent; border: none; cursor: default; }

        .day-pnl { font-size: 9px; font-weight: 700; scale: 0.9; }
        .bg-win { background: rgba(16, 185, 129, 0.25) !important; border-color: rgba(16, 185, 129, 0.4) !important; }
        .bg-loss { background: rgba(239, 68, 68, 0.25) !important; border-color: rgba(239, 68, 68, 0.4) !important; }

        /* 底部导出备份栏 */
        .backup-bar {
            margin-top: 24px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }
        .btn-backup {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-backup:hover { background: rgba(255, 255, 255, 0.12); color: white; }

        /* 弹窗 Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #1e293b; border: 1px solid var(--card-border);
            border-radius: var(--radius-lg); padding: 24px; width: 90%; max-width: 550px;
            max-height: 80vh; overflow-y: auto;
        }

        .badge-win { color: var(--accent-green); font-weight: 600; }
        .badge-loss { color: var(--accent-red); font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← 🏠 返回工具箱导航</a>

        <div class="header">
            <h1>🎯 MEME 交易纪律 & 复盘日历</h1>
        </div>

        <!-- 顶部总看板 -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">累计盈利单 / 亏损单</div>
                <div class="stat-value" id="winLossCount">0 / 0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">整体交易胜率</div>
                <div class="stat-value" id="winRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总盈亏状态</div>
                <div class="stat-value" id="totalPnlStatus">--</div>
            </div>
        </div>

        <!-- 核心：左右分栏 Dashboard 布局 -->
        <div class="dashboard-layout">
            
            <!-- 左侧：录入区域（主操作区，加宽放大） -->
            <div class="form-card">
                <h3 style="font-size: 15px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center;">
                    ✍️ 录入交易计划
                    <span style="font-size: 11px; color: #818cf8; font-weight: normal;">今日限 3 次</span>
                </h3>
                <form id="tradeForm" onsubmit="saveTrade(event)">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>日期</label>
                            <input type="date" id="tradeDate" required>
                        </div>
                        <div class="input-group">
                            <label>代币 Ticker</label>
                            <input type="text" id="tokenName" placeholder="$PEPE" required>
                        </div>
                        <div class="input-group">
                            <label>买入市值 (MC)</label>
                            <input type="text" id="marketCap" placeholder="150K" required>
                        </div>
                        <div class="input-group">
                            <label>交易状态</label>
                            <select id="tradeStatus">
                                <option value="持仓中">⏳ 持仓中</option>
                                <option value="止盈">🎯 止盈 (盈利)</option>
                                <option value="止损">💀 止损 (亏损)</option>
                            </select>
                        </div>
                        <div class="input-group full">
                            <label>盈亏数值 / 目标 (例: +200% 或 -50%)</label>
                            <input type="text" id="pnlValue" placeholder="+150%">
                        </div>
                        <div class="input-group full">
                            <label>💡 买入逻辑（强制思考：为什么买？是 Smart Money 进场还是 FOMO？）</label>
                            <textarea id="buyReason" rows="3" placeholder="写下逻辑，杜绝盲目冲狗..." required></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">⚡ 提交交易记录</button>
                </form>
            </div>

            <!-- 右侧：战绩日历（紧凑展示区） -->
            <div class="calendar-card">
                <div class="calendar-header">
                    <button class="cal-btn" onclick="changeMonth(-1)">◀ 上个月</button>
                    <h3 id="calendarMonthTitle" style="font-size: 15px;">2026年 8月</h3>
                    <button class="cal-btn" onclick="changeMonth(1)">下个月 ▶</button>
                </div>
                <div class="calendar-grid" id="calendarGrid">
                    <!-- 动态生成紧凑日历 -->
                </div>
            </div>

        </div>

        <!-- 底部数据备份与同步工具栏 -->
        <div class="backup-bar">
            <button class="btn-backup" onclick="exportData()">📤 导出跨设备备份 (JSON)</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 导入备份数据</button>
            <input type="file" id="importFile" style="display: none;" onchange="importData(event)" accept=".json">
        </div>
    </div>

    <!-- 每日明细弹窗 Modal -->
    <div class="modal" id="dayModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
                <h3 id="modalDateTitle" style="font-size: 15px;">明细查看</h3>
                <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:18px; cursor:pointer;">✕</button>
            </div>
            <div id="modalTradeList"></div>
        </div>
    </div>

    <script>
        let currentDate = new Date();

        function getStorageData() {
            const data = localStorage.getItem('meme_trades_data');
            return data ? JSON.parse(data) : [];
        }

        function setStorageData(data) {
            localStorage.setItem('meme_trades_data', JSON.stringify(data));
        }

        function init() {
            document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];
            updateTopStats();
            renderCalendar();
        }

        function updateTopStats() {
            const logs = getStorageData();
            let wins = 0;
            let losses = 0;

            logs.forEach(item => {
                if (item.status === '止盈') wins++;
                if (item.status === '止损') losses++;
            });

            const total = wins + losses;
            const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;

            document.getElementById('winLossCount').innerText = `${wins}胜 / ${losses}负`;
            document.getElementById('winRate').innerText = `${winRate}%`;

            const pnlStatus = document.getElementById('totalPnlStatus');
            if (wins > losses) {
                pnlStatus.innerText = "📈 总体盈利";
                pnlStatus.className = "stat-value val-green";
            } else if (losses > wins) {
                pnlStatus.innerText = "📉 总体亏损";
                pnlStatus.className = "stat-value val-red";
            } else {
                pnlStatus.innerText = "⚖️ 持平/初始化";
                pnlStatus.className = "stat-value";
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarMonthTitle').innerText = `${year}年 ${month + 1}月`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];
            daysOfWeek.forEach(d => {
                grid.innerHTML += `<div class="cal-day-label">${d}</div>`;
            });

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const logs = getStorageData();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="cal-day empty"></div>`;
            }

            for (let date = 1; date <= lastDate; date++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                const dayTrades = logs.filter(l => l.date === dateStr);

                let bgClass = '';
                let pnlText = '';

                if (dayTrades.length > 0) {
                    let hasWin = dayTrades.some(t => t.status === '止盈');
                    let hasLoss = dayTrades.some(t => t.status === '止损');

                    if (hasWin && !hasLoss) {
                        bgClass = 'bg-win';
                        pnlText = '🟢 盈利';
                    } else if (hasLoss && !hasWin) {
                        bgClass = 'bg-loss';
                        pnlText = '🔴 亏损';
                    } else {
                        pnlText = `🚀 ${dayTrades.length}笔`;
                    }
                }

                const dayEl = document.createElement('div');
                dayEl.className = `cal-day ${bgClass}`;
                dayEl.onclick = () => openDayModal(dateStr);
                dayEl.innerHTML = `
                    <span style="font-weight:600;">${date}</span>
                    <span class="day-pnl">${pnlText}</span>
                `;
                grid.appendChild(dayEl);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function saveTrade(e) {
            e.preventDefault();
            const logs = getStorageData();

            const newTrade = {
                id: Date.now(),
                date: document.getElementById('tradeDate').value,
                token: document.getElementById('tokenName').value.trim(),
                mc: document.getElementById('marketCap').value.trim(),
                status: document.getElementById('tradeStatus').value,
                pnl: document.getElementById('pnlValue').value.trim() || '未设定',
                reason: document.getElementById('buyReason').value.trim()
            };

            logs.unshift(newTrade);
            setStorageData(logs);

            document.getElementById('buyReason').value = '';
            document.getElementById('tokenName').value = '';
            document.getElementById('pnlValue').value = '';

            updateTopStats();
            renderCalendar();
        }

        function openDayModal(dateStr) {
            document.getElementById('modalDateTitle').innerText = `📅 ${dateStr} 交易复盘明细`;
            const logs = getStorageData();
            const dayTrades = logs.filter(l => l.date === dateStr);

            const modalList = document.getElementById('modalTradeList');
            modalList.innerHTML = '';

            if (dayTrades.length === 0) {
                modalList.innerHTML = `<p style="color:#64748b; text-align:center;">这一天没有任何交易，管住手非常棒！</p>`;
            } else {
                dayTrades.forEach(item => {
                    let badge = item.status === '止盈' ? '<span class="badge-win">🎯 止盈</span>' :
                                (item.status === '止损' ? '<span class="badge-loss">💀 止损</span>' : '⏳ 持仓中');
                    
                    modalList.innerHTML += `
                        <div style="background:rgba(15, 23, 42, 0.6); padding:12px; border-radius:8px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.05);">
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                                <strong>${item.token} (市值: ${item.mc})</strong>
                                <div>${badge} (${item.pnl})</div>
                            </div>
                            <div style="font-size:12px; color:#cbd5e1; line-height:1.4;">💡 逻辑: ${item.reason}</div>
                            <button onclick="deleteTrade(${item.id}, '${dateStr}')" style="background:none; border:none; color:#ef4444; font-size:11px; margin-top:8px; cursor:pointer;">删除记录</button>
                        </div>
                    `;
                });
            }

            document.getElementById('dayModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('dayModal').style.display = 'none';
        }

        function deleteTrade(id, dateStr) {
            if(confirm("确定删除这条记录？")) {
                let logs = getStorageData();
                logs = logs.filter(l => l.id !== id);
                setStorageData(logs);
                updateTopStats();
                renderCalendar();
                openDayModal(dateStr);
            }
        }

        // 导出跨设备备份 JSON
        function exportData() {
            const data = getStorageData();
            if (data.length === 0) {
                alert("当前没有可导出的交易数据！");
                return;
            }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meme_trades_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        // 导入跨设备备份 JSON
        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        setStorageData(importedData);
                        alert("✅ 数据导入成功！");
                        init();
                    } else {
                        alert("❌ 备份文件格式错误！");
                    }
                } catch (err) {
                    alert("❌ 导入失败，请检查文件内容！");
                }
            };
            reader.readAsText(file);
        }

        init();
    </script>
</body>
</html>
