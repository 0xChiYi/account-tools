<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEME 交易纪律 & 盈亏日历 - 0xChiYi Tools</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.65);
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 36px 24px;
            display: flex;
            justify-content: center;
        }

        .container { width: 100%; max-width: 1380px; }

        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--text-muted); text-decoration: none; font-size: 15px; margin-bottom: 20px; font-weight: 500;
        }
        .back-link:hover { color: #818cf8; }

        .header { text-align: center; margin-bottom: 28px; }
        .header h1 {
            font-size: 32px; font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 20px;
            text-align: center;
        }

        .stat-label { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
        .stat-value { font-size: 28px; font-weight: 700; font-family: 'Fira Code', monospace; }
        .val-green { color: var(--accent-green); }
        .val-red { color: var(--accent-red); }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 1fr 1.15fr;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 1024px) {
            .dashboard-layout { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr; }
        }

        .form-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group.full { grid-column: 1 / -1; }
        label { font-size: 13px; font-weight: 600; color: var(--text-muted); }

        input, select, textarea {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-md);
            padding: 12px 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #818cf8; }

        .btn-submit {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            color: white; border: none; border-radius: var(--radius-md);
            font-weight: 600; cursor: pointer; font-size: 15px;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
        }

        .calendar-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
        }

        .calendar-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 18px;
        }

        .cal-btn {
            background: rgba(255,255,255,0.08); border: 1px solid var(--card-border);
            color: white; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
        }
        .cal-btn:hover { background: rgba(255,255,255,0.18); }

        .calendar-grid {
            display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; text-align: center;
        }

        .cal-day-label { font-size: 13px; color: var(--text-muted); font-weight: 600; padding-bottom: 6px; }

        .cal-day {
            height: 64px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 6px;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.2s; font-size: 12px;
        }

        .cal-day:hover { border-color: #818cf8; transform: translateY(-2px); }
        .cal-day.empty { background: transparent; border: none; cursor: default; }

        .day-pnl { font-size: 11px; font-weight: 700; font-family: 'Fira Code', monospace; }
        .txt-win { color: var(--accent-green); }
        .txt-loss { color: var(--accent-red); }
        .bg-win { background: rgba(16, 185, 129, 0.18) !important; border-color: rgba(16, 185, 129, 0.4) !important; }
        .bg-loss { background: rgba(239, 68, 68, 0.18) !important; border-color: rgba(239, 68, 68, 0.4) !important; }

        .tag-badge {
            display: inline-block;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 12px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #cbd5e1;
            margin-right: 4px;
            margin-top: 4px;
        }

        .backup-bar {
            margin-top: 28px; display: flex; justify-content: flex-end; gap: 14px;
        }
        .btn-backup {
            background: rgba(255, 255, 255, 0.06); border: 1px solid var(--card-border);
            color: var(--text-muted); padding: 10px 16px; border-radius: 10px; font-size: 13px; cursor: pointer;
        }
        .btn-backup:hover { background: rgba(255, 255, 255, 0.15); color: white; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #1e293b; border: 1px solid var(--card-border);
            border-radius: var(--radius-lg); padding: 28px; width: 92%; max-width: 650px;
            max-height: 85vh; overflow-y: auto;
        }

        #posterCanvas { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← 🏠 返回工具箱导航</a>

        <div class="header">
            <h1>🎯 MEME 交易纪律 & 盈亏日历</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">累计胜单 / 亏单</div>
                <div class="stat-value" id="winLossCount">0 / 0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">整体交易胜率</div>
                <div class="stat-value" id="winRate">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">累计战绩状态</div>
                <div class="stat-value" id="totalPnlStatus">--</div>
            </div>
        </div>

        <div class="dashboard-layout">
            <div class="form-card">
                <h3 style="font-size: 17px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center;">
                    ✍️ 录入交易计划 / 战绩
                    <span style="font-size: 12px; color: #818cf8; font-weight: normal;">今日限 3 次</span>
                </h3>
                <form id="tradeForm" onsubmit="saveTrade(event)">
                    <input type="hidden" id="editingId" value="">
                    <div class="form-grid">
                        <div class="input-group">
                            <label>日期</label>
                            <input type="date" id="tradeDate" required>
                        </div>
                        <div class="input-group">
                            <label>代币 Ticker</label>
                            <input type="text" id="tokenName" placeholder="例如: $PEPE" required>
                        </div>
                        <div class="input-group">
                            <label>买入市值 (MC)</label>
                            <input type="text" id="marketCap" placeholder="例如: 150K" required>
                        </div>
                        <div class="input-group">
                            <label>买入本金 (U)</label>
                            <input type="text" id="buyAmount" placeholder="例如: 100U" required>
                        </div>
                        <div class="input-group">
                            <label>交易状态</label>
                            <select id="tradeStatus">
                                <option value="持仓中">⏳ 持仓中</option>
                                <option value="止盈">🎯 止盈 (盈利)</option>
                                <option value="止损">💀 止损 (亏损)</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>最终盈亏金额 (U)</label>
                            <input type="text" id="pnlValue" placeholder="例如: +201U 或 -10U">
                        </div>
                        <div class="input-group full">
                            <label>复盘归因标签 (多选/选填)</label>
                            <select id="tradeTag">
                                <option value="">无标签</option>
                                <option value="💀 Dev Rug/撤池">💀 Dev Rug/撤池</option>
                                <option value="😱 FOMO追高">😱 FOMO追高被接盘</option>
                                <option value="💎 钻石手卖早">💎 钻石手卖早了</option>
                                <option value="🤖 Smart Money跟单">🤖 Smart Money跟单</option>
                                <option value="🎯 严格按计划止盈止损">🎯 严格按计划执行</option>
                                <option value="🚀 叙事破圈爆发">🚀 叙事破圈爆发</option>
                            </select>
                        </div>
                        <div class="input-group full">
                            <label>💡 买入逻辑（为什么冲这个？写下复盘总结）</label>
                            <textarea id="buyReason" rows="3" placeholder="写下逻辑，杜绝盲目冲狗..." required></textarea>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">⚡ 提交交易记录</button>
                </form>
            </div>

            <div class="calendar-card">
                <div class="calendar-header">
                    <button class="cal-btn" onclick="changeMonth(-1)">◀ 上个月</button>
                    <h3 id="calendarMonthTitle" style="font-size: 17px;">2026年 8月</h3>
                    <button class="cal-btn" onclick="changeMonth(1)">下个月 ▶</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
            </div>
        </div>

        <div class="backup-bar">
            <button class="btn-backup" onclick="exportData()">📤 导出备份 (JSON)</button>
            <button class="btn-backup" onclick="document.getElementById('importFile').click()">📥 导入备份数据</button>
            <input type="file" id="importFile" style="display: none;" onchange="importData(event)" accept=".json">
        </div>
    </div>

    <!-- 弹窗 Modal -->
    <div class="modal" id="dayModal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
                <h3 id="modalDateTitle" style="font-size: 17px;">明细查看</h3>
                <button onclick="closeModal()" style="background:none; border:none; color:white; font-size:20px; cursor:pointer;">✕</button>
            </div>
            <div id="modalTradeList"></div>
            <div style="margin-top: 20px; text-align: right;">
                <button onclick="generatePoster()" class="btn-submit" style="width: auto; padding: 10px 20px;">📸 生成今日复盘战绩海报</button>
            </div>
        </div>
    </div>

    <!-- 海报预览弹窗 -->
    <div class="modal" id="posterModal">
        <div class="modal-content" style="text-align: center; max-width: 500px;">
            <h3 style="font-size: 16px; margin-bottom: 12px;">🖼️ 战绩海报生成成功</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">右键或长按图片即可复制/保存到本地</p>
            <img id="posterImage" style="width: 100%; border-radius: 12px; border: 1px solid var(--card-border);" src="" alt="战绩海报">
            <button onclick="closePosterModal()" class="cal-btn" style="margin-top: 16px; width: 100%; padding: 10px;">关闭</button>
        </div>
    </div>

    <canvas id="posterCanvas" width="600" height="800"></canvas>

    <script>
        let currentDate = new Date();
        let currentActiveDateStr = '';

        function getStorageData() {
            const data = localStorage.getItem('meme_trades_data');
            return data ? JSON.parse(data) : [];
        }

        function setStorageData(data) {
            localStorage.setItem('meme_trades_data', JSON.stringify(data));
        }

        function init() {
            document.getElementById('tradeDate').value = new Date().toISOString().split('T')[0];
            updateTopStats();
            renderCalendar();
        }

        function updateTopStats() {
            const logs = getStorageData();
            let wins = 0;
            let losses = 0;

            logs.forEach(item => {
                if (item.status === '止盈') wins++;
                if (item.status === '止损') losses++;
            });

            const total = wins + losses;
            const winRate = total > 0 ? ((wins / total) * 100).toFixed(1) : 0;

            document.getElementById('winLossCount').innerText = `${wins}胜 / ${losses}负`;
            document.getElementById('winRate').innerText = `${winRate}%`;

            const pnlStatus = document.getElementById('totalPnlStatus');
            if (wins > losses) {
                pnlStatus.innerText = "📈 总体盈利";
                pnlStatus.className = "stat-value val-green";
            } else if (losses > wins) {
                pnlStatus.innerText = "📉 总体亏损";
                pnlStatus.className = "stat-value val-red";
            } else {
                pnlStatus.innerText = "⚖️ 持平/初始化";
                pnlStatus.className = "stat-value";
            }
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('calendarMonthTitle').innerText = `${year}年 ${month + 1}月`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            const daysOfWeek = ['日', '一', '二', '三', '四', '五', '六'];
            daysOfWeek.forEach(d => {
                grid.innerHTML += `<div class="cal-day-label">${d}</div>`;
            });

            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            const logs = getStorageData();

            for (let i = 0; i < firstDay; i++) {
                grid.innerHTML += `<div class="cal-day empty"></div>`;
            }

            for (let date = 1; date <= lastDate; date++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                const dayTrades = logs.filter(l => l.date === dateStr);

                let bgClass = '';
                let pnlText = '';
                let txtClass = '';

                if (dayTrades.length > 0) {
                    let totalDayU = 0;
                    let hasSettled = false;

                    dayTrades.forEach(t => {
                        if (t.pnl) {
                            let num = parseFloat(t.pnl.replace(/[^0-9.-]/g, ''));
                            if (!isNaN(num)) {
                                totalDayU += num;
                                hasSettled = true;
                            }
                        }
                    });

                    if (hasSettled) {
                        if (totalDayU > 0) {
                            bgClass = 'bg-win';
                            txtClass = 'txt-win';
                            pnlText = `+${totalDayU}U`;
                        } else if (totalDayU < 0) {
                            bgClass = 'bg-loss';
                            txtClass = 'txt-loss';
                            pnlText = `${totalDayU}U`;
                        } else {
                            pnlText = `0U`;
                        }
                    } else {
                        pnlText = `🚀 ${dayTrades.length}笔`;
                    }
                }

                const dayEl = document.createElement('div');
                dayEl.className = `cal-day ${bgClass}`;
                dayEl.onclick = () => openDayModal(dateStr);
                dayEl.innerHTML = `
                    <span style="font-weight:600;">${date}</span>
                    <span class="day-pnl ${txtClass}">${pnlText}</span>
                `;
                grid.appendChild(dayEl);
            }
        }

        function changeMonth(delta) {
            currentDate.setMonth(currentDate.getMonth() + delta);
            renderCalendar();
        }

        function saveTrade(e) {
            e.preventDefault();
            let logs = getStorageData();
            const editingId = document.getElementById('editingId').value;

            const tradeData = {
                id: editingId ? parseInt(editingId) : Date.now(),
                date: document.getElementById('tradeDate').value,
                token: document.getElementById('tokenName').value.trim(),
                mc: document.getElementById('marketCap').value.trim(),
                buyAmount: document.getElementById('buyAmount').value.trim(),
                status: document.getElementById('tradeStatus').value,
                pnl: document.getElementById('pnlValue').value.trim() || '未结算',
                tag: document.getElementById('tradeTag').value,
                reason: document.getElementById('buyReason').value.trim()
            };

            if (editingId) {
                logs = logs.map(l => l.id === parseInt(editingId) ? tradeData : l);
                document.getElementById('editingId').value = '';
                document.getElementById('submitBtn').innerText = '⚡ 提交交易记录';
            } else {
                logs.unshift(tradeData);
            }

            setStorageData(logs);

            document.getElementById('tokenName').value = '';
            document.getElementById('marketCap').value = '';
            document.getElementById('buyAmount').value = '';
            document.getElementById('pnlValue').value = '';
            document.getElementById('buyReason').value = '';
            document.getElementById('tradeTag').value = '';

            updateTopStats();
            renderCalendar();
        }

        function openDayModal(dateStr) {
            currentActiveDateStr = dateStr;
            document.getElementById('modalDateTitle').innerText = `📅 ${dateStr} 交易复盘明细`;
            const logs = getStorageData();
            const dayTrades = logs.filter(l => l.date === dateStr);

            const modalList = document.getElementById('modalTradeList');
            modalList.innerHTML = '';

            if (dayTrades.length === 0) {
                modalList.innerHTML = `<p style="color:#64748b; text-align:center;">这一天没有任何交易，管住手非常棒！</p>`;
            } else {
                dayTrades.forEach(item => {
                    let badge = item.status === '止盈' ? '<span class="txt-win">🎯 止盈</span>' :
                                (item.status === '止损' ? '<span class="txt-loss">💀 止损</span>' : '⏳ 持仓中');
                    let tagHtml = item.tag ? `<span class="tag-badge">${item.tag}</span>` : '';

                    modalList.innerHTML += `
                        <div style="background:rgba(15, 23, 42, 0.7); padding:14px; border-radius:10px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.08);">
                            <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
                                <strong>${item.token} (买入: ${item.buyAmount || '未填'} | MC: ${item.mc})</strong>
                                <div>${badge} (<strong style="font-family:monospace;">${item.pnl}</strong>)</div>
                            </div>
                            <div style="font-size:13px; color:#cbd5e1; line-height:1.5;">💡 逻辑: ${item.reason}</div>
                            ${tagHtml}
                            <div style="margin-top:10px; display:flex; gap:12px;">
                                <button onclick="editTrade(${item.id})" style="background:none; border:none; color:#818cf8; font-size:12px; cursor:pointer;">✏️ 编辑修改</button>
                                <button onclick="deleteTrade(${item.id}, '${dateStr}')" style="background:none; border:none; color:#ef4444; font-size:12px; cursor:pointer;">🗑️ 删除</button>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById('dayModal').style.display = 'flex';
        }

        function editTrade(id) {
            const logs = getStorageData();
            const item = logs.find(l => l.id === id);
            if (!item) return;

            document.getElementById('editingId').value = item.id;
            document.getElementById('tradeDate').value = item.date;
            document.getElementById('tokenName').value = item.token;
            document.getElementById('marketCap').value = item.mc;
            document.getElementById('buyAmount').value = item.buyAmount || '';
            document.getElementById('tradeStatus').value = item.status;
            document.getElementById('pnlValue').value = item.pnl;
            document.getElementById('tradeTag').value = item.tag || '';
            document.getElementById('buyReason').value = item.reason;

            document.getElementById('submitBtn').innerText = '✨ 保存修改后的记录';
            closeModal();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function closeModal() {
            document.getElementById('dayModal').style.display = 'none';
        }

        function closePosterModal() {
            document.getElementById('posterModal').style.display = 'none';
        }

        function deleteTrade(id, dateStr) {
            if(confirm("确定删除这条记录？")) {
                let logs = getStorageData();
                logs = logs.filter(l => l.id !== id);
                setStorageData(logs);
                updateTopStats();
                renderCalendar();
                openDayModal(dateStr);
            }
        }

        // Canvas 生成炫酷战绩海报
        function generatePoster() {
            const canvas = document.getElementById('posterCanvas');
            const ctx = canvas.getContext('2d');
            const logs = getStorageData();
            const dayTrades = logs.filter(l => l.date === currentActiveDateStr);

            // 背景渐变
            let grad = ctx.createLinearGradient(0, 0, 0, 800);
            grad.addColorStop(0, '#0f172a');
            grad.addColorStop(1, '#1e1b4b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 600, 800);

            // 标题 Header
            ctx.fillStyle = '#818cf8';
            ctx.font = 'bold 20px Inter, sans-serif';
            ctx.fillText('0xChiYi Web3 MEME Journal', 40, 50);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Inter, sans-serif';
            ctx.fillText(`📅 ${currentActiveDateStr} 实战复盘`, 40, 95);

            // 算当日总 PnL
            let totalDayU = 0;
            dayTrades.forEach(t => {
                if (t.pnl) {
                    let num = parseFloat(t.pnl.replace(/[^0-9.-]/g, ''));
                    if (!isNaN(num)) totalDayU += num;
                }
            });

            // 战绩卡片框
            ctx.fillStyle = 'rgba(30, 41, 59, 0.8)';
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.roundRect(40, 120, 520, 100, 12);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#94a3b8';
            ctx.font = '14px Inter, sans-serif';
            ctx.fillText('当日战绩结果', 60, 155);

            ctx.font = 'bold 36px Fira Code, monospace';
            if (totalDayU > 0) {
                ctx.fillStyle = '#10b981';
                ctx.fillText(`+${totalDayU} U`, 60, 200);
            } else if (totalDayU < 0) {
                ctx.fillStyle = '#ef4444';
                ctx.fillText(`${totalDayU} U`, 60, 200);
            } else {
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`0 U`, 60, 200);
            }

            // 渲染交易明细
            let startY = 250;
            dayTrades.slice(0, 3).forEach((item, index) => {
                ctx.fillStyle = 'rgba(15, 23, 42, 0.7)';
                ctx.beginPath();
                ctx.roundRect(40, startY, 520, 140, 12);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 16px Inter, sans-serif';
                ctx.fillText(`${item.token} (买入: ${item.buyAmount || '--'} | MC: ${item.mc})`, 60, startY + 35);

                ctx.fillStyle = item.status === '止盈' ? '#10b981' : '#ef4444';
                ctx.font = 'bold 16px Fira Code, monospace';
                ctx.fillText(`${item.pnl}`, 460, startY + 35);

                ctx.fillStyle = '#cbd5e1';
                ctx.font = '13px Inter, sans-serif';
                ctx.fillText(`💡 逻辑: ${item.reason.substring(0, 30)}...`, 60, startY + 75);

                if (item.tag) {
                    ctx.fillStyle = 'rgba(99, 102, 241, 0.3)';
                    ctx.beginPath();
                    ctx.roundRect(60, startY + 95, 140, 26, 6);
                    ctx.fill();

                    ctx.fillStyle = '#c7d2fe';
                    ctx.font = '11px Inter, sans-serif';
                    ctx.fillText(item.tag, 70, startY + 112);
                }

                startY += 160;
            });

            // 水印 Footer
            ctx.fillStyle = '#64748b';
            ctx.font = '12px Inter, sans-serif';
            ctx.fillText('Powered by 0xChiYi Web3 Tools | 管住手·胜率高', 40, 770);

            // 转为图片弹窗
            const imgUrl = canvas.toDataURL('image/png');
            document.getElementById('posterImage').src = imgUrl;
            document.getElementById('posterModal').style.display = 'flex';
        }

        function exportData() {
            const data = getStorageData();
            if (data.length === 0) { alert("当前没有数据！"); return; }
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `meme_trades_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (Array.isArray(importedData)) {
                        setStorageData(importedData);
                        alert("✅ 数据导入成功！");
                        init();
                    } else {
                        alert("❌ 文件格式错误！");
                    }
                } catch (err) {
                    alert("❌ 导入失败！");
                }
            };
            reader.readAsText(file);
        }

        init();
    </script>
</body>
</html>
