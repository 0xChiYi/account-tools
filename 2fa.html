<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2FA 动态验证码生成器 - 0xChiYi Tools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <!-- 引入强大的 otplib 2FA 核心库 -->
    <script src="https://unpkg.com/otplib@12.0.1/otplib-browser.js"></script>
    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e1b4b;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-glow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 860px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-glow);
            padding: 36px 40px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #818cf8; }

        .header { text-align: center; margin-bottom: 24px; }
        .header h1 {
            font-size: 26px; font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }
        .header p { font-size: 14px; color: var(--text-muted); }

        .timer-box {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--card-border);
            padding: 10px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .progress-bar {
            width: 100px;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #818cf8;
            width: 100%;
            transition: width 1s linear;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 768px) { .editor-grid { grid-template-columns: 1fr; } }

        .field-group { display: flex; flex-direction: column; }
        .field-label {
            display: flex; justify-content: space-between;
            font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;
        }

        textarea {
            width: 100%; height: 260px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-md);
            padding: 14px;
            color: var(--text-main);
            font-family: 'Fira Code', monospace;
            font-size: 12px; line-height: 1.6; outline: none;
        }

        textarea:focus { border-color: #818cf8; }

        .btn-group { display: flex; gap: 12px; }
        .btn {
            flex: 1; padding: 12px; font-size: 14px; font-weight: 600;
            border-radius: var(--radius-md); border: none; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%); color: white; }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); color: white; border: 1px solid var(--card-border); }
        .btn-success { background: #10b981 !important; color: white !important; }

        .toast {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #10b981; color: white; padding: 10px 20px; border-radius: 30px;
            font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.3s; pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← 🏠 返回工具箱导航</a>

        <div class="header">
            <h1>🔑 2FA 动态验证码生成器</h1>
            <p>支持批量提取 2FA Key 并实时计算 6 位动态验证码</p>
        </div>

        <div class="timer-box">
            <span>⏱️ 验证码刷新倒计时: <strong id="seconds" style="color: #818cf8;">30</strong>s</span>
            <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        </div>

        <div class="editor-grid">
            <div class="field-group">
                <div class="field-label">
                    <span>输入密钥 / 完整账号文本</span>
                    <span id="inputCount" style="font-size: 11px;">0 条</span>
                </div>
                <textarea id="inputText" placeholder="支持纯 2FA 密钥，或任意分割的账号数据：&#10;4DWTLP5ECDP6YD3JIHKR7B3L3OGAHH4G&#10;账号----密码----2FA密钥&#10;账号----密码----辅助邮箱----2FA密钥" oninput="generateTOTP()"></textarea>
            </div>

            <div class="field-group">
                <div class="field-label">
                    <span>实时 6 位验证码 (Code)</span>
                    <span id="outputCount" style="font-size: 11px;">0 条</span>
                </div>
                <textarea id="outputText" readonly placeholder="6位验证码将在这里实时生成..."></textarea>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="clearAll()">清空内容</button>
            <button class="btn btn-primary" id="copyBtn" onclick="copyResult()">📋 一键复制全部验证码</button>
        </div>
    </div>

    <div id="toast" class="toast">✅ 已成功复制到剪贴板！</div>

    <script>
        // 清洗 2FA 密钥（去空格、强转大写、去非 Base32 字符）
        function cleanSecret(secret) {
            if (!secret) return "";
            return secret.replace(/[\s\-_]+/g, '').toUpperCase();
        }

        // 智能定位密钥段
        function extractSecret(line) {
            const raw = line.trim();
            if (!raw) return "";

            // 尝试多种常见的分隔符：----、---、|、,、Tab
            let parts = raw.split(/----|---|\||,|\t/);
            parts = parts.map(p => p.trim()).filter(p => p.length > 0);

            // 如果只有一段，直接当成 Secret 处理
            if (parts.length === 1) {
                return cleanSecret(parts[0]);
            }

            // 多段数据：通常 2FA 是最后一段无 @ 符号的 16+ 位英数串
            for (let i = parts.length - 1; i >= 0; i--) {
                const item = parts[i];
                if (!item.includes('@') && item.length >= 10) {
                    return cleanSecret(item);
                }
            }

            // 托底拿最后一段
            return cleanSecret(parts[parts.length - 1]);
        }

        function generateTOTP() {
            const input = document.getElementById('inputText').value;
            const lines = input.split('\n');
            const result = [];
            let validCount = 0;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed) {
                    try {
                        const secret = extractSecret(trimmed);
                        if (secret && secret.length >= 8) {
                            // 使用 window.otplib.authenticator 生成 2FA 码
                            const code = window.otplib.authenticator.generate(secret);
                            result.push(code);
                            validCount++;
                        } else {
                            result.push("// 密钥无效/太短");
                        }
                    } catch (e) {
                        result.push("// 密钥解析失败");
                    }
                }
            });

            document.getElementById('outputText').value = result.join('\n');
            document.getElementById('inputCount').innerText = `${lines.filter(l => l.trim()).length} 条`;
            document.getElementById('outputCount').innerText = `${validCount} 条生成成功`;
        }

        function updateTimer() {
            const epoch = Math.floor(Date.now() / 1000);
            const count = 30 - (epoch % 30);
            document.getElementById('seconds').innerText = count;
            
            const percentage = (count / 30) * 100;
            document.getElementById('progress').style.width = percentage + '%';

            if (count === 30) {
                generateTOTP();
            }
        }

        setInterval(updateTimer, 1000);
        updateTimer();

        function copyResult() {
            const outputText = document.getElementById('outputText');
            if (!outputText.value.trim()) return;

            outputText.select();
            document.execCommand('copy');

            const copyBtn = document.getElementById('copyBtn');
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = "✨ 复制成功！";
            copyBtn.classList.add('btn-success');
            showToast();

            setTimeout(() => {
                copyBtn.innerHTML = originalText;
                copyBtn.classList.remove('btn-success');
            }, 2000);
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            document.getElementById('inputCount').innerText = '0 条';
            document.getElementById('outputCount').innerText = '0 条';
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
</body>
</html>
