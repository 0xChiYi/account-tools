<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xChiYi Web3 实用工具箱 - 极客导航站</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-start: #0f172a;
            --bg-gradient-end: #1e1b4b;
            --card-bg: rgba(30, 41, 59, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-hover-border: rgba(129, 140, 248, 0.4);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-glow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 70%, #090d16 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 24px;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #c7d2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .header p {
            font-size: 15px;
            color: var(--text-muted);
        }

        /* 网格卡片布局 */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 24px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--card-hover-border);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.25);
            background: rgba(30, 41, 59, 0.85);
        }

        .card-disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .card-disabled:hover {
            transform: none;
            border-color: var(--card-border);
            box-shadow: none;
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: 500;
        }

        .badge-active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-soon {
            background: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }

        .card-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .footer {
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }

        .footer a {
            color: #818cf8;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🛠️ 0xChiYi Web3 工具箱</h1>
            <p>高效、安全、即开即用的链上与账号自动化工具集</p>
        </div>

        <div class="grid">
            <!-- 工具 1：账号格式化 -->
            <a href="account_formatter.html" class="card">
                <div>
                    <div class="card-icon">⚡</div>
                    <div class="card-title">
                        账号格式化工具
                        <span class="badge badge-active">已上线</span>
                    </div>
                    <div class="card-desc">支持 3 段 / 4 段账号一键清洗、清洗分隔符并格式化输出，支持自动复制。</div>
                </div>
            </a>

            <!-- 工具 2：推特批量转换 (预留) -->
            <div class="card card-disabled">
                <div>
                    <div class="card-icon">🐦</div>
                    <div class="card-title">
                        推特批量处理工具
                        <span class="badge badge-soon">即将推出</span>
                    </div>
                    <div class="card-desc">用于批量清洗推特 Auth Token、Cookie 提取与格式批量转换。</div>
                </div>
            </div>

            <!-- 工具 3：2FA 验证码生成 (已上线) -->
            <a href="2fa.html" class="card">
                <div>
                    <div class="card-icon">🔑</div>
                    <div class="card-title">
                        2FA 验证码生成器
                        <span class="badge badge-active">已上线</span>
                    </div>
                    <div class="card-desc">批量导入 2FA 密钥或完整账号数据，一键实时生成 6 位动态验证码。</div>
                </div>
            </a>
            
            <!-- 工具 4：MEME 交易复盘 -->
            <a href="journal.html" class="card">
                <div>
                    <div class="card-icon">🎯</div>
                    <div class="card-title">
                        MEME 交易纪律 & 复盘
                        <span class="badge badge-active">已上线</span>
                    </div>
                    <div class="card-desc">每日限 3 次出手配额，记录买入理由、市值与止盈止损，拒绝盲目冲狗。</div>
                </div>
            </a>
        </div>

        <div class="footer">
            <p>Powered by <a href="https://github.com/0xChiYi/account-tools" target="_blank">0xChiYi GitHub Hub</a></p>
        </div>
    </div>

</body>
</html>
